<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Employee Salary Management</title>

    <link rel="stylesheet" href="register.css">

</head>


<body>


    <div class="auth-container">


        <div class="auth-card">


            <!-- HEADER -->

            <div class="auth-header">

                <h1>
                    Employee Salary Management
                </h1>

                <p>
                    Create your account
                </p>

            </div>


            <!-- REGISTER FORM -->

            <form id="registerForm">


                <!-- NAME -->

                <div class="form-group">

                    <label for="registerName">
                        Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Enter password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- ROLE -->

                <div class="form-group">

                    <label for="registerRole">
                        Role
                    </label>

                    <select
                        id="registerRole"
                        required
                    >

                        <option value="">
                            Select Role
                        </option>

                        <option value="employee">
                            Employee
                        </option>

                        <option value="admin">
                            Admin
                        </option>

                    </select>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="register-btn"
                >
                    Register
                </button>


                <!-- MESSAGE -->

                <p
                    id="registerMessage"
                    class="message"
                ></p>


            </form>


            <!-- LOGIN LINK -->

            <div class="auth-footer">

                <p>

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>


        </div>

    </div>


    <script src="register.js"></script>

</body>

</html>
